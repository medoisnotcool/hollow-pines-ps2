name: Build PS2 ELF

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Compile with the PS2DEV toolchain
        run: |
          docker run --rm -v "$PWD":/src ps2dev/ps2dev:latest sh -c "apk add --no-cache make && cd /src && make"

      - name: Keep the finished .elf
        uses: actions/upload-artifact@v4
        with:
          name: hollow-pines-elf
          path: hollow_pines.elf
